# Render Blueprint: Liquidation Hub.
# Resource names below predate the rebrand. Renaming them makes Render provision new services and a
# new, empty database, so change them only for a fresh deployment.
# Render dashboard → New → Blueprint → pick this repo. Values marked `sync: false` are asked for
# on first deploy and never stored in git.

databases:
  - name: vrymnox-hub-db
    databaseName: staged_vrymnox
    user: vrymnox
    # Free Render Postgres expires after 30 days; switch to a paid plan for a long-lived portfolio.
    plan: free

services:
  # Express API. Applies backend/db/schema.sql on every boot (idempotent), then seeds the
  # showcase inventory when DEMO_MODE=true.
  - type: web
    name: vrymnox-hub-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production # Secure session cookie
      - key: DATABASE_URL
        fromDatabase:
          name: vrymnox-hub-db
          property: connectionString
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_ANALYTICS_SALT
        generateValue: true # generated once, then stable: keeps unique-visitor counts consistent
      - key: OPENAI_API_KEY
        sync: false # only needed for the owner-only /api/add-product
      # TRUST_PROXY defaults to 1 on Render. Calibrate after the first deploy: sign in as owner,
      # open https://<frontend>/api/admin/request-info, and raise it until `ip` is your own address.

  # Next.js frontend. All browser API calls go to /api/* here and are rewritten to the API.
  - type: web
    name: vrymnox-hub-web
    runtime: node
    rootDir: frontend/flash-sale-client
    plan: free
    # --include=dev: the build needs TypeScript and Tailwind (devDependencies). Next sets
    # NODE_ENV=production itself, so it is deliberately not set here.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: BACKEND_URL
        # The API's public URL, e.g. https://vrymnox-hub-api.onrender.com. Read at build time,
        # so redeploy this service after changing it.
        sync: false
